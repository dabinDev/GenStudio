services:
  mysql:
    image: mysql:8.4
    container_name: genstudio-mysql
    environment:
      MYSQL_DATABASE: genstudio
      MYSQL_USER: genstudio
      MYSQL_PASSWORD: genstudio
      MYSQL_ROOT_PASSWORD: genstudio-root
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - genstudio-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ugenstudio", "-pgenstudio"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    image: nginx:1.27-alpine
    container_name: genstudio-web
    profiles:
      - app
    ports:
      - "8080:80"
    volumes:
      - ./fronted/dist:/usr/share/nginx/html/genstudio:ro
      - ./admin/dist:/usr/share/nginx/html/genstudio-admin:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - mysql

volumes:
  genstudio-mysql-data:
